<main class="login-page">
  <div class="login-card">
    <h1>AutoAndes - Login</h1>
    
    @if (expirada()) {
      <div class="alert alert-warning">Su sesión ha expirado. Por favor, inicie sesión nuevamente.</div>
    }

    @if (errorMensaje()) {
      <div class="alert alert-error">{{ errorMensaje() }}</div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input id="username" autocomplete="username" autocomplete="username" type="text" formControlName="username" placeholder="Ingrese su usuario">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" autocomplete="current-password" autocomplete="current-password" type="password" formControlName="password" placeholder="Ingrese su contraseña">
      </div>

      <button type="submit" [disabled]="loginForm.invalid || cargando()">
        {{ cargando() ? 'Ingresando...' : 'Iniciar Sesión' }}
      </button>
    </form>
  </div>
</main>
